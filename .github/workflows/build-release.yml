name: Build Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '版本标签 (如 v1.0.0)'
        required: false
        default: ''

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Generate keystore if not provided
        if: "${{ secrets.KEYSTORE_BASE64 == '' }}"
        run: |
          keytool -genkey -v -keystore app/release.keystore \
            -alias release -keyalg RSA -keysize 2048 -validity 10000 \
            -storePassword github2024 -keypass github2024 \
            -dname "CN=GitHub Actions, OU=CI, O=GitHub, L=Unknown, ST=Unknown, C=US"
          echo "KEYSTORE_PASSWORD=github2024" >> $GITHUB_ENV
          echo "KEY_ALIAS=release" >> $GITHUB_ENV
          echo "KEY_PASSWORD=github2024" >> $GITHUB_ENV

      - name: Decode keystore
        if: "${{ secrets.KEYSTORE_BASE64 != '' }}"
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace
        env:
          KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD || secrets.KEY_PASSWORD }}

      - name: Get version info
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]] && [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]] && [[ -n "${{ github.event.inputs.tag }}" ]]; then
            echo "TAG=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            # push to main: 从 build.gradle 提取 versionName
            VERSION=$(grep 'versionName' app/build.gradle | head -1 | sed "s/.*versionName \"\(.*\)\".*/\1/")
            SHORT_SHA=$(git rev-parse --short HEAD)
            echo "TAG=v${VERSION}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          fi

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/*.apk \
            app/build/outputs/apk/release/VideoAudioExtractor-${{ steps.version.outputs.TAG }}.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoAudioExtractor-release-${{ steps.version.outputs.TAG }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
